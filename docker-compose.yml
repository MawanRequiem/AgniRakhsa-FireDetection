services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data       # TLS certificates persist here
      - caddy_config:/config
    depends_on:
      - web
      - backend
    networks:
      - app-network

  web:
    build:
      context: ./web
      network: host
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - ./web/.env
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    networks:
      - app-network

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
      network: host
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - ./whatsapp-gateway/.env
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
