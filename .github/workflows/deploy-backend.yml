name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - name: Pull latest code and Deploy Backend
        run: |
          cd ~/AgniRakhsa-FireDetection
          
          # Ambil update terbaru dari GitHub
          git fetch --all
          git reset --hard origin/main
          
          # Tulis file env di direktori yang benar
          echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          
          # Rebuild dan jalankan docker compose HANYA untuk backend
          docker compose up -d --build backend
