name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    - name: Run Pytest
      run: |
        cd backend
        pytest

  test-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "web/package-lock.json"
    - name: Install dependencies
      run: |
        cd web
        npm ci
    - name: Run Vitest
      run: |
        cd web
        npm run test -- --run

  test-gateway:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: "whatsapp-gateway/package-lock.json"
    - name: Install dependencies
      run: |
        cd whatsapp-gateway
        npm ci
    - name: Run Jest
      run: |
        cd whatsapp-gateway
        npm test
