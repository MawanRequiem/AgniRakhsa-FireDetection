name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'Caddyfile'

jobs:
  deploy-web:
    runs-on: self-hosted

    steps:
      - name: Pull latest code and Deploy Web
        run: |
          cd ~/AgniRakhsa-FireDetection
          
          # Ambil update terbaru dari GitHub
          git fetch --all
          git reset --hard origin/main
          
          # Tulis file env di direktori yang benar
          echo "${{ secrets.WEB_ENV }}" > web/.env
          
          # Rebuild dan jalankan docker compose HANYA untuk web dan caddy (reverse proxy)
          docker compose up -d --build web caddy
