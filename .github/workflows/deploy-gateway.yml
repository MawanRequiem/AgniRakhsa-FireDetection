name: Deploy WhatsApp Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'whatsapp-gateway/**'

jobs:
  deploy-gateway:
    runs-on: self-hosted

    steps:
      - name: Pull latest code and Deploy Gateway
        run: |
          cd ~/AgniRakhsa-FireDetection
          
          # Ambil update terbaru dari GitHub
          git fetch --all
          git reset --hard origin/main
          
          # Tulis file env di direktori yang benar
          echo "${{ secrets.GATEWAY_ENV }}" > whatsapp-gateway/.env
          
          # Rebuild dan jalankan docker compose HANYA untuk gateway
          docker compose up -d --build whatsapp-gateway
